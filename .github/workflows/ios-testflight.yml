name: Reusable iOS TestFlight delivery

on:
  workflow_call:
    inputs:
      validated_sha:
        description: Exact commit SHA already proven by CI
        required: true
        type: string
      prepare_script:
        description: Optional repository-relative script that prepares release assets
        required: false
        type: string
        default: ""
      minimum_build_number:
        description: Optional build-number floor for app-record resets or TestFlight cache recovery
        required: false
        type: number
        default: 0
    secrets:
      ASC_KEY_ID:
        required: true
      ASC_ISSUER_ID:
        required: true
      ASC_PRIVATE_KEY:
        required: true

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: ${{ github.repository }}-testflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Cheap release and credential preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_id: ${{ steps.map.outputs.app_id }}
      beta_group_id: ${{ steps.map.outputs.beta_group_id }}
      bundle_id: ${{ steps.map.outputs.bundle_id }}
      build_number: ${{ steps.build.outputs.build_number }}
      container: ${{ steps.map.outputs.container }}
      container_type: ${{ steps.map.outputs.container_type }}
      marketing_version: ${{ steps.map.outputs.marketing_version }}
      platform: ${{ steps.map.outputs.platform }}
      scheme: ${{ steps.map.outputs.scheme }}
      team_id: ${{ steps.map.outputs.team_id }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      EXPECTED_ASC_KEY_ID: ${{ vars.ASC_EXPECTED_KEY_ID }}
      EXPECTED_ASC_ISSUER_ID: ${{ vars.ASC_EXPECTED_ISSUER_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.validated_sha }}

      - name: Check out WorksBien release helpers
        uses: actions/checkout@v4
        with:
          repository: WorksBien-Studios/.github
          ref: main
          path: .worksbien-release

      - name: Confirm immutable release request
        env:
          VALIDATED_SHA: ${{ inputs.validated_sha }}
        run: |
          set -euo pipefail
          [[ "$VALIDATED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$VALIDATED_SHA" ]]

      - name: Load fail-closed app map
        id: map
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          data = json.loads(pathlib.Path('.github/testflight-app-map.json').read_text())
          required = ['repository','bundle_id','team_id','asc_app_id','asc_key_id','asc_issuer_id','beta_group_id','listing_platform','marketing_version','xcode_container_type','xcode_container','scheme','required_check_name','signing_style','export_method','signing_certificate']
          missing = [key for key in required if not str(data.get(key, '')).strip()]
          if data.get('state') != 'ready': missing.insert(0, 'state=ready')
          if missing: raise SystemExit('TestFlight map is not release-ready: ' + ', '.join(missing))
          if data['repository'] != os.environ['GITHUB_REPOSITORY']: raise SystemExit('Repository does not match app map.')
          if data['xcode_container_type'] not in ('project','workspace'): raise SystemExit('Invalid Xcode container type.')
          if data['signing_style'] != 'automatic' or data['export_method'] != 'app-store-connect' or data['signing_certificate'] != 'Apple Distribution': raise SystemExit('Release signing contract changed.')
          if not pathlib.Path(data['xcode_container']).exists(): raise SystemExit('Mapped Xcode container is missing.')
          values = {'app_id':data['asc_app_id'],'beta_group_id':data['beta_group_id'],'bundle_id':data['bundle_id'],'container':data['xcode_container'],'container_type':data['xcode_container_type'],'marketing_version':data['marketing_version'],'platform':data['listing_platform'],'scheme':data['scheme'],'team_id':data['team_id'],'expected_key_id':data['asc_key_id'],'expected_issuer_id':data['asc_issuer_id'],'required_check_name':data['required_check_name']}
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for key,value in values.items(): out.write(f'{key}={value}\n')
          PY

      - name: Prove exact-SHA CI
        env:
          REQUIRED_CHECK: ${{ steps.map.outputs.required_check_name }}
          VALIDATED_SHA: ${{ inputs.validated_sha }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/commits/$VALIDATED_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/check-runs.json"
          python3 - "$RUNNER_TEMP/check-runs.json" "$REQUIRED_CHECK" <<'PY'
          import json, sys
          runs=json.load(open(sys.argv[1])).get('check_runs',[]); wanted=sys.argv[2]
          if not any((r.get('name')==wanted or wanted in r.get('name','')) and r.get('conclusion')=='success' for r in runs): raise SystemExit(f'No successful exact-SHA check matched {wanted!r}.')
          PY

      - name: Verify mapped App Store Connect route
        env:
          ASC_APP_ID: ${{ steps.map.outputs.app_id }}
          IOS_BUNDLE_ID: ${{ steps.map.outputs.bundle_id }}
          MAP_KEY_ID: ${{ steps.map.outputs.expected_key_id }}
          MAP_ISSUER_ID: ${{ steps.map.outputs.expected_issuer_id }}
        run: |
          set -euo pipefail
          [[ -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" && -n "$ASC_PRIVATE_KEY" ]]
          [[ "$ASC_KEY_ID" == "$MAP_KEY_ID" && "$ASC_KEY_ID" == "$EXPECTED_ASC_KEY_ID" ]]
          [[ "$ASC_ISSUER_ID" == "$MAP_ISSUER_ID" && "$ASC_ISSUER_ID" == "$EXPECTED_ASC_ISSUER_ID" ]]
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          umask 077; printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          jwt="$(ruby .worksbien-release/scripts/asc_jwt.rb "$key_path" "$ASC_KEY_ID" "$ASC_ISSUER_ID")"
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $jwt" "https://api.appstoreconnect.apple.com/v1/apps/$ASC_APP_ID" -o "$RUNNER_TEMP/app.json"
          python3 - "$RUNNER_TEMP/app.json" <<'PY'
          import json, os, sys
          app=json.load(open(sys.argv[1]))['data']
          if app['id'] != os.environ['ASC_APP_ID'] or app['attributes']['bundleId'] != os.environ['IOS_BUNDLE_ID']: raise SystemExit('Authenticated route does not match app map.')
          PY

      - name: Choose unused build number
        id: build
        env:
          ASC_APP_ID: ${{ steps.map.outputs.app_id }}
          MINIMUM_BUILD_NUMBER: ${{ inputs.minimum_build_number }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          jwt="$(ruby .worksbien-release/scripts/asc_jwt.rb "$key_path" "$ASC_KEY_ID" "$ASC_ISSUER_ID")"
          curl --fail-with-body --silent --show-error --get -H "Authorization: Bearer $jwt" --data-urlencode "filter[app]=$ASC_APP_ID" --data-urlencode 'sort=-uploadedDate' --data-urlencode 'limit=50' 'https://api.appstoreconnect.apple.com/v1/builds' -o "$RUNNER_TEMP/builds.json"
          build_number="$(python3 - "$RUNNER_TEMP/builds.json" <<'PY'
          import json,sys
          values=[x.get('attributes',{}).get('version','') for x in json.load(open(sys.argv[1])).get('data',[])]
          nums=[int(v) for v in values if v.isdigit()]
          floor=int(__import__('os').environ.get('MINIMUM_BUILD_NUMBER') or 0)
          print(max(max(nums) if nums else 0, floor-1)+1)
          PY
          )"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

  build-upload:
    name: Archive, export, verify and upload once
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 30
    env:
      APPLE_TEAM_ID: ${{ needs.preflight.outputs.team_id }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      BUILD_NUMBER: ${{ needs.preflight.outputs.build_number }}
      CONTAINER_PATH: ${{ needs.preflight.outputs.container }}
      CONTAINER_TYPE: ${{ needs.preflight.outputs.container_type }}
      IOS_BUNDLE_ID: ${{ needs.preflight.outputs.bundle_id }}
      MARKETING_VERSION: ${{ needs.preflight.outputs.marketing_version }}
      SCHEME: ${{ needs.preflight.outputs.scheme }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.validated_sha }}

      - name: Prepare Xcode and credentials
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.6.app ]]; then sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer; fi
          key_dir="$HOME/.appstoreconnect/private_keys"; mkdir -p "$key_dir"; chmod 700 "$key_dir"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"; umask 077; printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"; chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$RUNNER_TEMP/App.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$RUNNER_TEMP/export" >> "$GITHUB_ENV"

      - name: Prepare app-specific release assets
        if: ${{ inputs.prepare_script != '' }}
        env:
          PREPARE_SCRIPT: ${{ inputs.prepare_script }}
        run: |
          set -euo pipefail
          [[ "$PREPARE_SCRIPT" =~ ^[A-Za-z0-9_./-]+$ ]]
          [[ -f "$PREPARE_SCRIPT" ]]
          bash "$PREPARE_SCRIPT"

      - name: Archive once
        run: |
          set -euo pipefail
          if [[ "$CONTAINER_TYPE" == workspace ]]; then flag=-workspace; else flag=-project; fi
          xcodebuild "$flag" "$CONTAINER_PATH" -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' -archivePath "$ARCHIVE_PATH" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive

      - name: Verify archive identity
        run: |
          set -euo pipefail
          app="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"; [[ -n "$app" ]]
          plist="$app/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" == "$IOS_BUNDLE_ID" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" == "$MARKETING_VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" == "$BUILD_NUMBER" ]]
          [[ -f "$app/PrivacyInfo.xcprivacy" ]]
          minimum_os="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist")"
          while IFS= read -r -d '' framework; do
            framework_plist="$framework/Info.plist"; [[ -f "$framework_plist" ]]
            /usr/libexec/PlistBuddy -c 'Delete :MinimumOSVersion' "$framework_plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string $minimum_os" "$framework_plist"
            codesign --force --sign - --timestamp=none "$framework"
          done < <(find "$app/Frameworks" -depth -type d -name '*.framework' -print0 2>/dev/null || true)

      - name: Export signed IPA once
        run: |
          set -euo pipefail
          options="$RUNNER_TEMP/ExportOptions.plist"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0"><dict>' '<key>method</key><string>app-store-connect</string>' '<key>destination</key><string>export</string>' '<key>signingStyle</key><string>automatic</string>' '<key>signingCertificate</key><string>Apple Distribution</string>' "<key>teamID</key><string>$APPLE_TEAM_ID</string>" '<key>manageAppVersionAndBuildNumber</key><false/>' '<key>uploadSymbols</key><true/>' '</dict></plist>' > "$options"
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportPath "$EXPORT_PATH" -exportOptionsPlist "$options" -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ipa="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"; [[ -n "$ipa" ]]; echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      - name: Verify exported package
        run: |
          set -euo pipefail
          verify="$RUNNER_TEMP/ipa-verify"; mkdir -p "$verify"; ditto -x -k "$IPA_PATH" "$verify"
          app="$(find "$verify/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"; [[ -n "$app" ]]
          plist="$app/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" == "$IOS_BUNDLE_ID" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" == "$MARKETING_VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" == "$BUILD_NUMBER" ]]
          [[ -f "$app/PrivacyInfo.xcprivacy" ]]
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign -dvv "$app" 2>&1)"; [[ "$signature" == *'Authority=Apple Distribution'* && "$signature" == *"TeamIdentifier=$APPLE_TEAM_ID"* ]]

      - name: Upload the same IPA once
        run: xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

  deliver:
    name: Process, deliver and attach exact build
    needs: [preflight, build-upload]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ASC_APP_ID: ${{ needs.preflight.outputs.app_id }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      BETA_GROUP_ID: ${{ needs.preflight.outputs.beta_group_id }}
      BUILD_NUMBER: ${{ needs.preflight.outputs.build_number }}
      IOS_BUNDLE_ID: ${{ needs.preflight.outputs.bundle_id }}
      LISTING_PLATFORM: ${{ needs.preflight.outputs.platform }}
      MARKETING_VERSION: ${{ needs.preflight.outputs.marketing_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.validated_sha }}

      - name: Check out WorksBien release helpers
        uses: actions/checkout@v4
        with:
          repository: WorksBien-Studios/.github
          ref: main
          path: .worksbien-release
      - name: Process, deliver and attach exact build
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"; umask 077; printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"; chmod 600 "$key_path"
          ASC_KEY_PATH="$key_path" ruby .worksbien-release/scripts/asc_delivery.rb
